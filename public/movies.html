<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="movies-body">
    <h1 class="movies-title">Welcome to Movies Database</h1>

    <div class="search-bar">
      <input class="search-input" id="search" placeholder="Search movies..." />

      <button class="search-btn" onclick="searchMovies()">Search</button>
    </div>

    <div id="results" class="movies-grid"></div>

    <script>
      const token = localStorage.getItem("token");
      if (!token) {
        alert("You must be logged in");
        window.location.href = "/login.html";
      }
      async function searchMovies() {
        const query = document.getElementById("search").value;

        const res = await fetch(
          `https://www.omdbapi.com/?apikey=ee5c0e34&s=${query}`,
        );

        const data = await res.json();

        const resultsDiv = document.getElementById("results");

        if (data.Search) {
          resultsDiv.innerHTML = data.Search.map(
            (movie) => `
        <div class="movie-card">
          <h3>${movie.Title}</h3>
          <img src="${movie.Poster}" width="150"/>
          <p>${movie.Year}</p>
        </div>
      `,
          ).join("");
        } else {
          resultsDiv.innerHTML = "No movies found";
        }
      }
    </script>
  </body>
</html>
